# Coloca no quadro (Project 1 da org) toda issue aberta que ainda não está lá.
# Roda a cada 30 minutos e por disparo manual. Incluir uma issue que já está no quadro não muda nada.
# No disparo manual, `incluir_fechadas` também inclui as issues fechadas e as põe em Done
# (a regra do Project "fechou → Done" só vale para issues que já estavam no quadro ao fechar).
# Precisa do secret da org ADD_TO_PROJECT_PAT: token fine-grained com Projects: Read and write.
name: Quadro

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs de issues, separadas por espaço. Vazio: todas as issues abertas da org."
        required: false
        default: ""
      incluir_fechadas:
        description: "Incluir também as issues fechadas da org, em Done."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: quadro
  cancel-in-progress: false

jobs:
  incluir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Incluir issues no quadro
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          URLS: ${{ inputs.urls }}
          FECHADAS: ${{ inputs.incluir_fechadas }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta o secret ADD_TO_PROJECT_PAT na organização."
            exit 1
          fi
          org=ArtemisHubApp
          projeto=$(gh project view 1 --owner "$org" --format json --jq .id)
          status=$(gh project field-list 1 --owner "$org" --format json --jq '.fields[] | select(.name == "Status")')
          campo=$(jq -r .id <<< "$status")
          done_id=$(jq -r '.options[] | select(.name == "Done") | .id' <<< "$status")

          manual=sim
          if [ -z "${URLS:-}" ]; then
            manual=nao
            URLS=$(gh search issues --owner "$org" --state open --limit 1000 --json url --jq '.[].url')
          fi
          FECHADAS_URLS=""
          if [ "${FECHADAS:-false}" = "true" ]; then
            FECHADAS_URLS=$(gh search issues --owner "$org" --state closed --limit 1000 --json url --jq '.[].url')
          fi

          padrao='^https://github\.com/ArtemisHubApp/[A-Za-z0-9._-]+/issues/[0-9]+$'
          total=0; em_done=0; falhas=0
          incluir() {
            local url=$1 fechada=$2 item
            if [[ ! "$url" =~ $padrao ]]; then
              echo "::warning::Ignorado, não é issue da org: $url"
              return 0
            fi
            if ! item=$(gh project item-add 1 --owner "$org" --url "$url" --format json --jq .id); then
              falhas=$((falhas + 1)); echo "::warning::Não consegui incluir $url"; return 0
            fi
            total=$((total + 1))
            if [ "$fechada" = "sim" ]; then
              if gh project item-edit --id "$item" --project-id "$projeto" --field-id "$campo" \
                   --single-select-option-id "$done_id" > /dev/null; then
                em_done=$((em_done + 1))
              else
                falhas=$((falhas + 1)); echo "::warning::Não consegui pôr em Done: $url"
              fi
            fi
          }
          for url in $URLS; do
            fechada=nao
            # URL passada à mão pode ser de issue fechada: confere o estado (a busca já traz só abertas).
            if [ "$manual" = "sim" ] && [ "$(gh issue view "$url" --json state --jq .state 2>/dev/null)" = "CLOSED" ]; then
              fechada=sim
            fi
            incluir "$url" "$fechada"
          done
          for url in $FECHADAS_URLS; do incluir "$url" sim; done
          echo "Issues no quadro: $total (em Done: $em_done). Falhas: $falhas."
          [ "$falhas" -eq 0 ]
