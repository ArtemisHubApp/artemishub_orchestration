# Release deste repo em SemVer (ADR-013): roda quando um PR `release:` é mesclado na main
# (o título do PR vai na mensagem do merge commit) e por disparo manual.
# A lógica fica no workflow reutilizável, que os outros repos chamam do mesmo jeito.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Força a versão (vX.Y.Z). Vazio: calcula pelos PRs."
        default: ""
      alvo:
        description: "Commit da release. Vazio: a ponta da main."
        default: ""
      titulo_release:
        description: "Título do PR de release (release: <tema>). Vazio: o do PR que gerou o commit."
        default: ""

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release:')
    uses: ./.github/workflows/release-reutilizavel.yml
    with:
      versao: ${{ inputs.versao || '' }}
      alvo: ${{ inputs.alvo || '' }}
      titulo_release: ${{ inputs.titulo_release || '' }}
      # Neste repo o script vem da própria branch que disparou (staging no disparo manual).
      ref_scripts: ${{ github.ref_name }}
