name: Gitleaks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (CLI oficial via container, sem licença)
        # `git` é o subcomando atual do gitleaks v8; `detect` está obsoleto.
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose
